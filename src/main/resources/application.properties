spring.application.name=ms-config-server
server.port=${CONFIG_SERVER_PORT:8888}

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/alejandro-enrique-pirela-ramirez/Config-repo-facturador-electronico.git}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
# Responder 404 si no existe configuracion para la aplicacion solicitada.
spring.cloud.config.server.accept-empty=false
